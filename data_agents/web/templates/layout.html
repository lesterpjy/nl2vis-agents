<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Data Agents{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <a class="brand" href="/workspace">Data Agents</a>
  {% if user %}
  <span class="who">{{ user.name }}<span class="role">{{ user.role }}</span></span>
  <form method="post" action="/sign-out"><button class="link">sign out</button></form>
  {% endif %}
</header>
<main>{% block main %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
