[project]
name = "data-agents"
version = "0.1.0"
description = "Two cooperating agents that answer natural-language questions over registered SQLite databases with read-only SQL and chart the answers in a fixed house style."
requires-python = ">=3.12"
authors = [{ name = "Lester Yang" }]
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic>=2.9",
    "logfire[sqlite3]>=3.0",
    "sqlglot>=25",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "altair>=5.4",
    "pydantic-evals>=2.42.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1",              # the GUI's templates
    "python-multipart>=0.0.9",  # HTML forms post urlencoded bodies; FastAPI reads them through this
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
]

[project.license]
text = "MIT"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
