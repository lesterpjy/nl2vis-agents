name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # The databases are not in the repository, and the suite queries them.
      - run: uv run python scripts/fetch_databases.py
      # No API key: every model response replays from tests/evals/recordings/.
      - run: uv run pytest -q
